# This file defines the workspace for the a2a-friend-scheduling project.
# It tells uv that this project is a monorepo containing multiple packages.

[project]
name = "a2a-friend-scheduling"
version = "0.1.0"
description = "A multi-agent system for scheduling pickleball games."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Shared ADK & A2A Dependencies
    "google-adk[extensions]>=1.2.1",
    "a2a-sdk>=1.0.3",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.0.0",
    "click",
    "uvicorn",
    "google-generativeai",
    "httpx",
    # OpenTelemetry / OpenInference for Lumoz observability
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "openinference-instrumentation-google-adk>=0.1.0",
    "openinference-semantic-conventions>=0.1.0",
    # Kaitlyn's agent dependencies (future)
    # "langgraph"
    "sse-starlette>=3.4.4",
]
