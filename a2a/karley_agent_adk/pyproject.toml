[project]
name = "karley-scheduling-agent"
version = "0.1.0"
description = "Karley's scheduling agent for the A2A project."
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk>=1.0.3",
    "google-adk[extensions]>=1.2.1",
    "python-dotenv>=1.0.0",
    "uvicorn",
    "sse-starlette>=3.4.4",
    # OpenTelemetry / OpenInference for Lumoz observability
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "openinference-instrumentation-google-adk>=0.1.0",
    "openinference-semantic-conventions>=0.1.0",
] 
